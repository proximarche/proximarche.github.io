<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProxiMarché</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f7f5ef;--card:#fff;--tx:#1f2a1f;--mut:#6b756b;--ac:#2f7d4f;--ac2:#e8f3ec;--bd:#e2e0d6;--warn:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#161a16;--card:#1f251f;--tx:#eef2ee;--mut:#9aa59a;--ac:#5fc088;--ac2:#25382c;--bd:#2f372f;--warn:#fb923c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;max-width:560px;margin:auto;padding:env(safe-area-inset-top) 0 80px}
header{padding:16px;font-weight:700;font-size:20px}header small{display:block;font-weight:400;color:var(--mut);font-size:13px}main{padding:0 14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;max-width:560px;margin:auto;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 2px;font-size:12px}nav button span{display:block;font-size:20px}nav .on{color:var(--ac);font-weight:700}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;margin:3px 0}
button.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px}button.g{background:var(--ac2);color:var(--ac);border:0;border-radius:10px;padding:8px 12px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}.m{color:var(--mut);font-size:13px}.p{font-weight:700;color:var(--ac)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac)}.tag.x{background:#fde8dc;color:var(--warn)}.sel{display:flex;gap:8px}.sel>*{flex:1}h3{margin:16px 0 4px}
</style></head><body>
<header>🛒 ProxiMarché<small>Les petits commerces près de chez vous</small></header>
<main id="app">Chargement…</main><nav id="nav"></nav>
<script>
const sb=supabase.createClient("https://tytcrpbooehvcfmsvskd.supabase.co","sb_publishable_GKA7NR7_BJ56uErANBLk0Q_TgFxPolR");
let S=[],PR=[],me=null,pos=null,tab=0,q="",list=[],onlyOpen=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const H=new Date().getHours(),open=s=>H>=s.open_hour&&H<s.close_hour,e=n=>(+n).toFixed(2).replace(".",",")+" €";
function km(s){if(!pos||s.lat==null)return null;const r=x=>x*Math.PI/180,a=Math.sin(r(s.lat-pos.lat)/2)**2+Math.cos(r(pos.lat))*Math.cos(r(s.lat))*Math.sin(r(s.lng-pos.lng)/2)**2;return 12742*Math.asin(Math.sqrt(a))}
const kt=s=>km(s)==null?"":"📍 "+km(s).toFixed(1)+" km";
const my=()=>me&&S.find(s=>s.owner_id==me.id);
async function load(){const a=await sb.from("shops").select("*,products(*)");if(a.error)alert(a.error.message);S=(a.data||[]).map(s=>({...s,p:Object.fromEntries((s.products||[]).map(x=>[x.name,+x.price]))}));
 const b=await sb.from("promos").select("*,shops(name)").gt("ends_at",new Date().toISOString());PR=b.data||[]}
async function init(){const s=(await sb.auth.getSession()).data.session;me=s?s.user:null;await load();render()}
function loc(){navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude};render()},()=>alert("Position refusée"))}
const all=()=>[...new Set(S.flatMap(s=>Object.keys(s.p)))].sort();
const dl=()=>`<datalist id=dl>${all().map(a=>`<option>${esc(a)}</option>`).join("")}</datalist>`;
function res(){if(!q)return `<p class=m>${S.length?"Tape un produit pour comparer les prix.":"Aucun commerce inscrit pour l'instant. Les commerçants peuvent s'inscrire dans l'onglet Commerçant."}</p>`;
 const k=q.toLowerCase(),r=S.map(s=>({s,k:Object.keys(s.p).filter(x=>x.includes(k))})).filter(x=>x.k.length&&(!onlyOpen||open(x.s))).sort((a,b)=>a.s.p[a.k[0]]-b.s.p[b.k[0]]);
 return r.length?r.map(({s,k})=>`<div class=c><div class=r><b>${esc(s.name)}</b><span class="tag ${open(s)?"":"x"}">${open(s)?"Ouvert":"Fermé"} · ${s.open_hour}h-${s.close_hour}h</span></div>${k.map(x=>`<div class=r><span>${esc(x)}</span><span class=p>${e(s.p[x])}</span></div>`).join("")}<div class="r m"><span>${kt(s)}</span><button class=g data-a="${esc(k[0])}" onclick="add(this.dataset.a)">+ Ma liste</button></div></div>`).join(""):`<p class=m>Aucun commerce n'a ce produit pour l'instant.</p>`}
function upd(){document.getElementById("res").innerHTML=res()}
function add(x){if(!list.includes(x))list.push(x);alert(x+" ajouté à ta liste")}
const sv=()=>`<button class=g onclick="loc()">${pos?"📍 Position active":"📍 Me localiser"}</button><input id=q placeholder="Chercher un produit (ex : harissa)" value="${esc(q)}" oninput="q=this.value;upd()" list=dl>${dl()}<label class=m style="display:block;margin:6px 0"><input type=checkbox style="width:auto" ${onlyOpen?"checked":""} onchange="onlyOpen=this.checked;upd()"> Ouverts maintenant seulement</label><div id=res>${res()}</div>`;
function combos(){const out=[],n=S.length,cost=c=>{let t=0;for(const it of list){const v=c.map(i=>S[i].p[it]).filter(x=>x!=null);if(!v.length)return null;t+=Math.min(...v)}return t};
 for(let a=0;a<n;a++){let c=cost([a]);if(c!=null)out.push({c:[a],t:c});for(let b=a+1;b<n;b++){c=cost([a,b]);if(c!=null)out.push({c:[a,b],t:c});for(let d=b+1;d<n;d++){c=cost([a,b,d]);if(c!=null)out.push({c:[a,b,d],t:c})}}}
 const best={};out.forEach(o=>{const k=o.c.length;if(!best[k]||o.t<best[k].t)best[k]=o});return Object.values(best)}
function lv(){const cs=list.length?combos():[];
 return `<div class=sel><input id=n placeholder="Ajouter un produit" list=dl><button class=b onclick="let v=n.value.trim().toLowerCase();if(v&&!list.includes(v))list.push(v);render()">+</button></div>${dl()}<div class=c>${list.map((x,i)=>`<div class=r><span>${esc(x)}</span><button class=g onclick="list.splice(${i},1);render()">✕</button></div>`).join("")||"<span class=m>Liste vide</span>"}</div><h3>Meilleures options</h3>`+
 (cs.length?cs.map(o=>`<div class=c><div class=r><b>${o.c.length} magasin${o.c.length>1?"s":""}</b><span class=p>${e(o.t)}</span></div><div class=m>${o.c.map(i=>esc(S[i].name)).join(" · ")}</div>${list.map(it=>{let b=null;o.c.forEach(i=>{const v=S[i].p[it];if(v!=null&&(!b||v<b.v))b={v,s:S[i].name}});return `<div class="r m"><span>${esc(it)} → ${esc(b.s)}</span><span>${e(b.v)}</span></div>`}).join("")}</div>`).join(""):`<p class=m>${list.length?"Aucune combinaison de 3 commerces maximum ne couvre ta liste.":"Ajoute des produits à ta liste."}</p>`)}
function pv(){return `<h3>Anti-gaspi</h3>`+(PR.length?PR.map(p=>`<div class=c><div class=r><b>${esc(p.title)}</b><span class="tag x">-${Math.round((1-p.new_price/p.old_price)*100)}%</span></div><div class=r><span class=m>${esc(p.shops?p.shops.name:"")} · jusqu'à ${new Date(p.ends_at).getHours()}h</span><span><s class=m>${e(p.old_price)}</s> <span class=p>${e(p.new_price)}</span></span></div></div>`).join(""):`<p class=m>Aucune promo en cours.</p>`)}
async function auth(m){const r=m?await sb.auth.signUp({email:ue.value,password:up.value}):await sb.auth.signInWithPassword({email:ue.value,password:up.value});if(r.error)return alert(r.error.message);if(m&&!r.data.session)return alert("Compte créé. Confirme ton e-mail puis connecte-toi.");init()}
async function mk(){const n=sn.value.trim();if(!n)return;const r=await sb.from("shops").insert({name:n,lat:pos?pos.lat:null,lng:pos?pos.lng:null,open_hour:+so.value||8,close_hour:+sc.value||20});if(r.error)return alert(r.error.message);init()}
async function ap(){const n=pn.value.trim().toLowerCase(),v=+pv_.value;if(!n||!(v>0))return alert("Nom et prix requis");const r=await sb.from("products").insert({shop_id:my().id,name:n,price:v});if(r.error)return alert(r.error.message);init()}
async function ep(id,o){const v=+prompt("Nouveau prix (€)",o);if(v>0){await sb.from("products").update({price:v}).eq("id",id);init()}}
async function dp(id){if(confirm("Supprimer ce produit ?")){await sb.from("products").delete().eq("id",id);init()}}
async function pp(){const o=+po.value,n=+pn2.value;if(!pt.value||!o||!(n>0)||n>=o)return alert("Titre + prix promo < prix normal");const d=new Date();d.setHours(+ph.value||20,0,0,0);if(d<new Date())d.setDate(d.getDate()+1);const r=await sb.from("promos").insert({shop_id:my().id,title:pt.value,old_price:o,new_price:n,ends_at:d.toISOString()});if(r.error)return alert(r.error.message);init();alert("Promo publiée")}
function mv(){if(!me)return `<h3>🏪 Espace commerçant</h3><div class=c><input id=ue type=email placeholder="E-mail"><input id=up type=password placeholder="Mot de passe (6 caractères min.)"><div class=sel style="margin-top:8px"><button class=b onclick="auth(false)">Connexion</button><button class=g onclick="auth(true)">Créer un compte</button></div></div>`;
 const s=my(),out=`<button class=g onclick="sb.auth.signOut().then(init)">Se déconnecter (${esc(me.email)})</button>`;
 if(!s)return out+`<h3>Crée ton commerce</h3><div class=c><input id=sn placeholder="Nom du commerce"><div class=sel><input id=so type=number placeholder="Ouvre (h)" value=8><input id=sc type=number placeholder="Ferme (h)" value=20></div><button class=g onclick="loc()">${pos?"📍 Position enregistrée":"📍 Utiliser ma position"}</button> <button class=b onclick="mk()">Créer</button></div>`;
 return out+`<h3>${esc(s.name)}</h3><div class=c>${(s.products||[]).map(x=>`<div class=r><span>${esc(x.name)}</span><span><b class=p onclick="ep('${x.id}',${x.price})">${e(x.price)} ✏️</b> <button class=g onclick="dp('${x.id}')">✕</button></span></div>`).join("")||"<span class=m>Aucun produit</span>"}</div>
 <div class=c><b>Ajouter un produit</b><div class=sel><input id=pn placeholder="Produit"><input id=pv_ type=number step=0.01 placeholder="Prix €"></div><button class=b onclick="ap()">Ajouter</button></div>
 <div class=c><b>🏷️ Promo invendus</b><input id=pt placeholder="Ex : 10 baguettes"><div class=sel><input id=po type=number step=0.1 placeholder="Prix normal"><input id=pn2 type=number step=0.1 placeholder="Prix promo"><input id=ph type=number placeholder="Jusqu'à (h)" value=19></div><button class=b onclick="pp()">Publier</button></div>`}
const T=["🔍 Recherche","📝 Ma liste","🏷️ Promos","🏪 Commerçant"];
function render(){nav.innerHTML=T.map((t,i)=>`<button class="${tab==i?"on":""}" onclick="tab=${i};render()"><span>${t.split(" ")[0]}</span>${t.split(" ")[1]}</button>`).join("");app.innerHTML=[sv,lv,pv,mv][tab]()}
render();init();
</script></body></html>
